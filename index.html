<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ensiklopedia Sisingaan Bagian 5</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector('a-scene');

      // 1. Ambil target entity masing-masing halaman
      const target0 = document.querySelector('#target0');
      const target1 = document.querySelector('#target1');
      const target2 = document.querySelector('#target2');
      const target3 = document.querySelector('#target3');
      const target4 = document.querySelector('#target4');
  
      // 2. Ambil audio & video masing-masing halaman
      const audio20 = document.querySelector('#audio_halaman20');
      const audio21 = document.querySelector('#audio_halaman21');
      const audio22 = document.querySelector('#audio_desain');
      const audio23 = document.querySelector('#audio_atribut');
      const audio24 = document.querySelector('#audio_ikat');

      // Unmute & Unlock Audio/Video secara otomatis pada sentuhan/klik pertama di layar
      const unlockMediaOnFirstTouch = () => {
        // Unlock Audio
        [audio20, audio21, audio22, audio23, audio24].forEach(audio => {
          if (audio) {
            audio.play().then(() => {
              audio.pause();
              audio.currentTime = 0;
            }).catch(() => {});
          }
        });

        // Unlock Video 
        [].forEach(video => {
          if (video) {
            video.muted = false;
            video.play().then(() => {
              video.pause();
              video.currentTime = 0;
            }).catch(() => {});
          }
        });

        window.removeEventListener('touchstart', unlockMediaOnFirstTouch);
        window.removeEventListener('click', unlockMediaOnFirstTouch);
      };

      window.addEventListener('touchstart', unlockMediaOnFirstTouch, { once: true });
      window.addEventListener('click', unlockMediaOnFirstTouch, { once: true });

      // Helper Listener Audio
      function setupAudioTarget(targetEl, audioEl) {
        if (!targetEl || !audioEl) return;

        targetEl.addEventListener("targetFound", () => {
          audioEl.play().catch(e => console.log("Autoplay audio terhalang: ", e));
        });

        targetEl.addEventListener("targetLost", () => {
          audioEl.pause();
          audioEl.currentTime = 0;
        });
      }

      // Helper Listener Video
      function setupVideoTarget(targetEl, videoEl) {
        if (!targetEl || !videoEl) return;

        targetEl.addEventListener("targetFound", () => {
          videoEl.play().catch(e => {
            console.log("Autoplay video terhalang, mencoba memutar tanpa suara...", e);
            videoEl.muted = true; // Fallback jika browser tetap memblokir audio video
            videoEl.play();
          });
        });

        targetEl.addEventListener("targetLost", () => {
          videoEl.pause();
          videoEl.currentTime = 0;
        });
      }

      // Pasang Listener Audio
      setupAudioTarget(target0, audio20);
      setupAudioTarget(target1, audio21);
      setupAudioTarget(target2, audio22);
      setupAudioTarget(target3, audio23);
      setupAudioTarget(target4, audio24);
    
      // Pasang Listener Video

    });
  </script>
</head>
<body style="margin: 0; overflow: hidden;">

<a-scene 
    gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/v1/decoders/;"
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 12;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

  <a-assets>
    <!-- Target 0: Halaman 20 -->
    <a-asset-item id="bajuseragamModel20" src="./halaman 20/compressed-baju seragam.glb"></a-asset-item>
    <audio id="audio_halaman20" src="./halaman 20/halaman20 audio.mp3" preload="auto"></audio>

    <!-- Target 1: Halaman 21 -->
     <a-asset-item id="bajuhalaman21Model21" src="./halaman 21/compressed-baju halaman 21.glb"></a-asset-item>
    <audio id="audio_halaman21" src="./halaman 21/halaman21 audio.mp3" preload="auto"></audio>

    <!-- Target 2: Halaman 22 -->
    <a-asset-item id="peragabusana3Model22" src="./halaman 22/compressed-peraga busana 3.glb"></a-asset-item>
    <audio id="audio_desain" src="./halaman 22/desain kostum.mp3" preload="auto"></audio>

    <!-- Target 3: Halaman 23 -->
    <img id="atributModel23" src="./halaman 23/atribut baju.jpg"></img>
    <a-asset-item id="peragaModel23" src="./halaman 23/compressed-peraga busana 2.glb"></a-asset-item>
    <audio id="audio_atribut" src="./halaman 23/atribut.mp3" preload="auto"></audio>

    <!-- Target 4: Halaman 24 -->
    <a-asset-item id="ikatModel24" src="./halaman 24/compressed-ikat kepala.glb"></a-asset-item>
    <a-asset-item id="kaosModel24" src="./halaman 24/compressed-kaos kaki bagus.glb"></a-asset-item>
    <a-asset-item id="sabukModel24" src="./halaman 24/compressed-sabuk.glb"></a-asset-item>
    <a-asset-item id="sepatuModel24" src="./halaman 24/compressed-sepatu.glb"></a-asset-item>
    <audio id="audio_ikat" src="./halaman 24/ikat 24 audio.mp3" preload="auto"></audio>

  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- TARGET 0 (Halaman 20) -->
  <a-entity id="target0" mindar-image-target="targetIndex: 0">
    <a-gltf-model src="#bajuseragamModel20" position="0 0 0" scale="0.3 0.3 0.3" rotation="90 0 0" animation-mixer animation></a-gltf-model>
  </a-entity>

  <!-- TARGET 1 (Halaman 21) -->
  <a-entity id="target1" mindar-image-target="targetIndex: 1">
    <a-gltf-model src="#bajuhalaman21Model21" position="0 0 0" scale="0.5 0.5 0.5" rotation="90 0 0" animation-mixer animation></a-gltf-model>
  </a-entity>

  <!-- TARGET 2 (Halaman 22) -->
  <a-entity id="target2" mindar-image-target="targetIndex: 2">
    <a-gltf-model src="#peragabusana3Model22" position="0.2 0 0" scale="0.3 0.3 0.3" rotation="90 0 0" animation-mixer animation></a-gltf-model>
  </a-entity>

  <!-- TARGET 3 (Halaman 23) -->
  <a-entity id="target3" mindar-image-target="targetIndex: 3">
    <a-image src="#atributModel23" position="0 0.15 0.25" rotation="90 0 0" width="0.5" height="0.5" material="shader: flat"></a-image>
    <a-gltf-model src="#peragaModel23" position="0 0 0" scale="0.3 0.3 0.3" rotation="90 0 0" animation-mixer animation></a-gltf-model>
  </a-entity>

  <!-- TARGET 4 (Halaman 24) -->
  <a-entity id="target4" mindar-image-target="targetIndex: 4">
    <a-gltf-model src="#ikatModel24" position="-0.25 0.25 0" scale="0.15 0.15 0.15" rotation="90 0 0" animation-mixer animation></a-gltf-model>
    <a-gltf-model src="#kaosModel24" position="-0.25 -0.3 0" scale="0.15 0.15 0.15" rotation="90 0 0" animation-mixer></a-gltf-model>
    <a-gltf-model src="#kaosModel24" position="-0.25 -0.4 0" scale="0.15 0.15 0.15" rotation="90 0 0" animation-mixer></a-gltf-model>
    <a-gltf-model src="#sabukModel24" position="0.25 0.2 0" scale="0.15 0.15 0.15" rotation="90 0 0" animation-mixer></a-gltf-model>
    <a-gltf-model src="#sepatuModel24" position="0.25 -0.3 0" scale="0.15 0.15 0.15" rotation="90 0 0" animation-mixer></a-gltf-model>
  </a-entity>

</a-scene>

</body>
</html>
